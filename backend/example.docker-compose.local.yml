# Local development override. Copy to docker-compose.local.yml and fill in secrets.
# Auth: AUTH_PROVIDER=none uses the noop provider (sign in with any email; no token validation).
# Prodtrack: Set PRODTRACK_PROVIDER=mock to use the read-only mock (no ShotGrid needed).
# To use real ShotGrid, set PRODTRACK_PROVIDER=shotgrid and SHOTGRID_URL, SHOTGRID_SCRIPT_NAME, SHOTGRID_API_KEY.
services:
  api:
    environment:
      - PYTHONUNBUFFERED=1
      - SHOTGRID_URL=https://aswf.shotgrid.autodesk.com/
      - SHOTGRID_API_KEY=************
      - SHOTGRID_SCRIPT_NAME=DNA_local_testing
      - PRODTRACK_PROVIDER=mock
      - VEXA_API_KEY=**********
      - VEXA_API_URL=http://vexa:8056
      - OPENAI_API_KEY=your-openai-api-key
      - AUTH_PROVIDER=none
      # Transcript publishing (V1, disabled by default). Set to "true" to
      # expose POST /playlists/{id}/publish-transcript. See DEPLOYMENT.md
      # for the ShotGrid site-setup checklist the custom entity depends on.
      - DNA_ENABLE_TRANSCRIPT_PUBLISH=false
      - SHOTGRID_TRANSCRIPT_ENTITY=CustomEntity01
      # Follow Along's external id — the backend half of the feature the
      # VITE_FOLLOW_ALONG_* settings turn on (frontend/packages/app/.env.example).
      # Name the production-tracking field holding the same id the review player
      # announces for a clip; the versions a playlist loads are then matched
      # against it. It is a custom field that does not exist on a stock ShotGrid
      # site, so LEAVING THIS EMPTY IS THE SUPPORTED DEFAULT: unset leaves the
      # ShotGrid query untouched and the feature simply off.
      #
      # Set it wrong or leave it unset with the frontend feature ON and every
      # version comes back with no external_ref, nothing matches, and each clip
      # change reports "Review moved off this playlist". (At SPI the field is
      # sg_jts, a number field labelled "JTS".)
      - PRODTRACK_VERSION_EXTERNAL_REF_FIELD=
      # Meeting recording playback (disabled by default, like transcript
      # publishing above). The app asks GET /capabilities once at start-up and
      # hides the Recording tab unless this is "true" — so a deployment whose
      # collector is archiving files correctly still shows no tab until it is
      # set. Needs the collector running and RECORDING_NETWORK_PATH served.
      - DNA_ENABLE_RECORDING_PLAYBACK=false
      # Turns on DELETE /playlists/{id}/data, which clears one playlist's stored
      # transcript, metadata and draft notes. scripts/reset-playlist-data.sh uses it to
      # reset a test from the recording host, whose only route here is this API. Leave
      # false outside a test deployment: it is the one delete that takes a whole
      # playlist's history rather than a single row someone named.
      - DNA_ENABLE_PLAYLIST_RESET=false
