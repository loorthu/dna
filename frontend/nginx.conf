# Top-level nginx config for the DNA frontend image.
#
# The stock one is replaced for two reasons, both about running as a NON-ROOT user with a uid this
# image cannot know — which is how OpenShift runs every pod, assigning an arbitrary uid per
# namespace. Neither change affects a root deployment.
#
#   1. The pid file and the worker temp directories move to /tmp. /var/run and /var/cache/nginx
#      are root-owned, and nginx will not start if it cannot write its pid.
#   2. The server block is included from /tmp rather than /etc/nginx/conf.d, because that is where
#      NGINX_ENVSUBST_OUTPUT_DIR points the entrypoint's envsubst step for the same reason.

# Kept as the FIRST directive because docker-entrypoint.d/20-serve-as-share-user.sh rewrites this
# line (`sed s/^user .*/`) to run the workers as the identity that owns the recordings share. On a
# non-root start there is nobody to drop privileges to, the script says so and skips, and nginx
# warns that the directive is moot — both are expected.
user nginx;

worker_processes auto;

# The container's log is the log. The stock image symlinks /var/log/nginx/* to these anyway; naming
# them directly means one less root-owned path to reason about.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    # Every path nginx writes to while serving a request. All under /tmp so an arbitrary uid can
    # use them; the defaults live under /var/cache/nginx, which it cannot.
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # The rendered default.conf.template. A glob that matches nothing is not an error in nginx, so
    # a failed render would leave a running server with no listener rather than a failed start —
    # docker-entrypoint.d/25-require-rendered-config.sh is what turns that back into a failure.
    include /tmp/nginx-conf.d/*.conf;
}
