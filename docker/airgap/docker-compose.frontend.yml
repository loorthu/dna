# DNA prod deployment — FRONTEND ONLY.
# The DNA backend + mongo run on another host (with internet, for Gemini/Gmail).
# This nginx serves the SPA and reverse-proxies /api + /ws to that backend
# (BACKEND_URL) — so the browser only ever talks to this host (no CORS).
#
#   docker compose --env-file docker/airgap/.env -f docker/airgap/docker-compose.frontend.yml build
#   docker compose --env-file docker/airgap/.env -f docker/airgap/docker-compose.frontend.yml up -d
name: dna-frontend

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        # /api is relative — nginx proxies it to BACKEND_URL. VITE_WS_URL empty
        # => the app derives ws://<this-origin>/ws, which nginx also proxies.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-none}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Follow Along. /review-sessions is relative — nginx proxies it to
        # REVIEW_SESSIONS_URL below. Unset broker or topic leaves it off.
        VITE_FEATURE_FOLLOW_ALONG: ${VITE_FEATURE_FOLLOW_ALONG:-}
        VITE_FOLLOW_ALONG_BROKER_URL: ${VITE_FOLLOW_ALONG_BROKER_URL:-}
        VITE_FOLLOW_ALONG_TOPIC: ${VITE_FOLLOW_ALONG_TOPIC:-}
        VITE_FOLLOW_ALONG_SESSIONS_URL: ${VITE_FOLLOW_ALONG_SESSIONS_URL:-/review-sessions}
    image: dna-frontend:${DNA_TAG:-airgap}
    container_name: dna-frontend
    ports:
      - "${DNA_FRONTEND_PORT:-8081}:8080"
    environment:
      # The host running the DNA backend (API + WS). nginx proxies /api + /ws here.
      - BACKEND_URL=${BACKEND_URL:-http://160.33.19.70:8000}
      # Review player's session directory; nginx proxies /review-sessions here.
      # The default is a dead local port — Follow Along's session picker is
      # simply unavailable until a site points this at its own directory.
      - REVIEW_SESSIONS_URL=${REVIEW_SESSIONS_URL:-http://127.0.0.1:9}
      # Where the archived recordings are mounted; nginx aliases /recordings/ here.
      # Substituted into default.conf.template at container start, like BACKEND_URL.
      - RECORDING_NETWORK_PATH=${RECORDING_NETWORK_PATH:-./recordings}
    volumes:
      # The archived recordings, served straight off the share by nginx (see
      # default.conf.template). Read-only: the collector writes them, this only
      # reads. Same path inside both containers so a network_path recorded by
      # the collector is the same string nginx resolves.
      - ${RECORDING_NETWORK_PATH:-./recordings}:${RECORDING_NETWORK_PATH:-./recordings}:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mirrors each meeting recording out of Vexa (through DNA, the only path across the
  # airgap) while the meeting runs, then muxes in the audio, writes the finished file to
  # the share, records it in DNA and only then releases the upstream copy.
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
      additional_contexts:
        # The collection logic comes from the backend package so it is the same code the
        # backend test suite covers — not a vendored second copy.
        dna: ../../backend/src/dna
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: dna-collector:${DNA_TAG:-airgap}
    container_name: dna-collector
    # The uid:gid archives are written as. It MUST be able to write RECORDING_NETWORK_PATH, and
    # nginx must be able to read what it writes — so the right value is whoever owns the share,
    # not a number chosen here. Defaults to the image's unprivileged user; set COLLECTOR_UID /
    # COLLECTOR_GID in .env for the real mount. Deliberately not root: an archive is the only copy
    # of that meeting once the upstream is released, and a root-owned file cannot be rotated or
    # removed by the people who own the share.
    user: "${COLLECTOR_UID:-1000}:${COLLECTOR_GID:-1000}"
    environment:
      # The collector talks to the DNA backend DIRECTLY, not through this host's nginx:
      # it is a server-side client, so there is no origin to keep single and no reason
      # to add a proxy hop to several hundred MB per meeting.
      - DNA_API_URL=${BACKEND_URL:-http://160.33.19.70:8000}
      - DNA_API_TOKEN=${DNA_API_TOKEN:-}
      - COLLECTOR_STAGING_DIR=/staging
      - RECORDING_NETWORK_PATH=${RECORDING_NETWORK_PATH:-./recordings}
      - COLLECTOR_POLL_SECONDS=${COLLECTOR_POLL_SECONDS:-10}
    volumes:
      # Staging is a NAMED volume, not a bind or a tmpfs: a half-mirrored meeting has to
      # survive a container restart, which is the whole point of the resume logic.
      - collector-staging:/staging
      - ${RECORDING_NETWORK_PATH:-./recordings}:${RECORDING_NETWORK_PATH:-./recordings}
    restart: unless-stopped

volumes:
  collector-staging:
