# DNA production compose (air-gapped).
# Two independent images (dna-backend = FastAPI, dna-frontend = nginx static) + mongo.
# Build on prod via the internal Artifactory (build.args come from .env), OR
# transfer prebuilt images (save.sh/load.sh). DNA reaches Vexa over the NETWORK
# (VEXA_API_URL) — Vexa runs on a different host.
#
#   docker compose --env-file docker/airgap/.env -f docker/airgap/docker-compose.prod.yml build
#   docker compose --env-file docker/airgap/.env -f docker/airgap/docker-compose.prod.yml up -d
name: dna

services:
  mongo:
    image: mongo:7
    container_name: dna-mongo
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=dna
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: dna-backend:${DNA_TAG:-airgap}
    container_name: dna-backend
    ports:
      - "${DNA_API_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MONGODB_URL=mongodb://mongo:27017
      - STORAGE_PROVIDER=mongodb
      # ShotGrid / prodtrack
      - PRODTRACK_PROVIDER=${PRODTRACK_PROVIDER:-shotgrid}
      - SHOTGRID_URL=${SHOTGRID_URL:-}
      - SHOTGRID_SCRIPT_NAME=${SHOTGRID_SCRIPT_NAME:-}
      - SHOTGRID_API_KEY=${SHOTGRID_API_KEY:-}
      # Follow Along's external id. Undeclared here until now, which meant the
      # setting was silently inert on this path however the env was written:
      # compose passes only what a service declares. Empty is the supported
      # default (feature off); see backend/example.docker-compose.local.yml.
      - PRODTRACK_VERSION_EXTERNAL_REF_FIELD=${PRODTRACK_VERSION_EXTERNAL_REF_FIELD:-}
      # Vexa runs on another host — reached over the network (not a shared docker net).
      - VEXA_API_URL=${VEXA_API_URL:-http://160.33.19.70:18056}
      - VEXA_API_KEY=${VEXA_API_KEY:-}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_URL=${GEMINI_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      # Auth + CORS (frontend is a separate origin: http://<host>:${DNA_FRONTEND_PORT})
      - AUTH_PROVIDER=${AUTH_PROVIDER:-none}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Transcript publishing
      - DNA_ENABLE_TRANSCRIPT_PUBLISH=${DNA_ENABLE_TRANSCRIPT_PUBLISH:-false}
      # Playlist reset, for re-running an end-to-end test (see scripts/reset-playlist-data.sh)
      - DNA_ENABLE_PLAYLIST_RESET=${DNA_ENABLE_PLAYLIST_RESET:-false}
      - SHOTGRID_TRANSCRIPT_ENTITY=${SHOTGRID_TRANSCRIPT_ENTITY:-CustomEntity01}
      # Email
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-gmail}
      - EMAIL_SENDER=${EMAIL_SENDER:-}
      - GMAIL_CREDENTIALS_DIR=/app/gmail-credentials
      # Where the FRONTEND is served, as the recipient's browser would reach it — e.g.
      # http://<host>:${DNA_FRONTEND_PORT}. The notes email links each shot to the artist
      # review page, and a mail client has no origin to resolve a bare path against, so
      # leaving this unset simply sends the email without those links.
      - DNA_APP_BASE_URL=${DNA_APP_BASE_URL:-}
    volumes:
      # Put client_secret.json + token.json in this host dir on prod (mounted ro).
      - ${GMAIL_CREDENTIALS_HOST_DIR:-./gmail-credentials}:/app/gmail-credentials:ro
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        # Baked into the static build — must be URLs the end user's BROWSER can reach.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-none}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: dna-frontend:${DNA_TAG:-airgap}
    container_name: dna-frontend
    ports:
      - "${DNA_FRONTEND_PORT:-8081}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
